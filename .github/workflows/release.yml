name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache: true
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.3
      - name: Validate SemVer tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%FT%TZ)" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "CHART_REPOSITORY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts" >> "$GITHUB_ENV"
          echo "CHART=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts/aws-cost-exporter" >> "$GITHUB_ENV"
      - name: Install pinned release tools
        run: |
          go install github.com/goreleaser/goreleaser/v2@v2.17.0
          go install github.com/anchore/syft/cmd/syft@v1.46.0
          go install github.com/sigstore/cosign/v3/cmd/cosign@v3.1.1
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          TRIVY_VERSION=0.72.0
          TRIVY_ARCHIVE="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL --retry 3 \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${TRIVY_ARCHIVE}" \
            --output "$RUNNER_TEMP/$TRIVY_ARCHIVE"
          echo "bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea  $RUNNER_TEMP/$TRIVY_ARCHIVE" \
            | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$TRIVY_ARCHIVE" -C /usr/local/bin trivy
          goreleaser --version
          syft version
          cosign version
          govulncheck -version
          trivy --version
      - name: Verify VEX reachability evidence
        run: |
          govulncheck -scan symbol ./cmd/aws-cost-exporter
          echo "GOVULNCHECK_RESULT=passed" >> "$GITHUB_ENV"
      - name: Build and scan every image platform
        shell: bash
        run: |
          docker buildx create --name release-builder --driver docker-container --use
          for platform in linux/amd64 linux/arm64; do
            arch="${platform#*/}"
            docker buildx build --platform "$platform" --load --tag "aws-cost-exporter:scan-$arch" \
              --build-arg VERSION="$VERSION" --build-arg REVISION="$GITHUB_SHA" \
              --build-arg BUILD_DATE="$BUILD_DATE" .
            trivy image --platform "$platform" --exit-code 1 --severity HIGH,CRITICAL \
              --vex .vex/CVE-2026-56852.openvex.json \
              "aws-cost-exporter:scan-$arch"
          done
          echo "TRIVY_RESULT=passed" >> "$GITHUB_ENV"
      - name: Authenticate registries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Push image with provenance and SBOM
        shell: bash
        run: |
          tags=(--tag "$IMAGE:$VERSION")
          if [[ "$VERSION" != *-* ]]; then tags+=(--tag "$IMAGE:latest"); fi
          metadata_file="$RUNNER_TEMP/image-metadata.json"
          docker buildx build --platform linux/amd64,linux/arm64 \
            "${tags[@]}" --build-arg VERSION="$VERSION" \
            --build-arg REVISION="$GITHUB_SHA" --build-arg BUILD_DATE="$BUILD_DATE" \
            --provenance=mode=max --sbom=true --push \
            --metadata-file "$metadata_file" .
          digest="$(jq -er '.["containerimage.digest"]' "$metadata_file")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"
      - name: Sign image by digest
        run: cosign sign --yes "$IMAGE@$IMAGE_DIGEST"
      - name: Package, push, and sign Helm chart
        shell: bash
        run: |
          helm package charts/aws-cost-exporter --version "$VERSION" \
            --app-version "$VERSION" --destination dist
          output="$(helm push "dist/aws-cost-exporter-$VERSION.tgz" \
            "oci://$CHART_REPOSITORY" 2>&1)"
          echo "$output"
          digest="$(awk '/^Digest: sha256:/{print $2}' <<< "$output")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          CHART_DIGEST="$digest"
          echo "CHART_DIGEST=$digest" >> "$GITHUB_ENV"
          cosign sign --yes "$CHART@$CHART_DIGEST"
      - name: Publish draft GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: goreleaser release --clean
      - name: Create sanitized release audit input
        shell: bash
        run: |
          set -euo pipefail
          audit_file="$RUNNER_TEMP/release-audit-input.json"
          mapfile -t archives < <(find dist -maxdepth 1 -type f \( -name 'aws-cost-exporter_*.tar.gz' -o -name 'aws-cost-exporter_*.zip' \) -printf '%f\n' | sort)
          mapfile -t sboms < <(find dist -maxdepth 1 -type f -name 'aws-cost-exporter_*.spdx.json' -printf '%f\n' | sort)
          if [ "${#archives[@]}" -ne 6 ] || [ "${#sboms[@]}" -ne 6 ] || [ ! -f dist/checksums.txt ]; then
            echo "unexpected GoReleaser release assets: archives=${#archives[@]} sboms=${#sboms[@]}"
            exit 1
          fi
          mapfile -t assets < <(printf '%s\n' "${archives[@]}" "${sboms[@]}" checksums.txt | sort)
          asset_names="$(printf '%s\n' "${assets[@]}" | jq -R . | jq -s .)"
          jq -n \
            --arg tag "$GITHUB_REF_NAME" \
            --arg source_sha "$GITHUB_SHA" \
            --arg workflow_url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg image "$IMAGE@$IMAGE_DIGEST" \
            --arg chart "$CHART@$CHART_DIGEST" \
            --arg image_digest "$IMAGE_DIGEST" \
            --arg chart_digest "$CHART_DIGEST" \
            --arg cosign_version "v3.1.1" \
            --arg certificate_identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$GITHUB_REF_NAME" \
            --arg certificate_oidc_issuer "https://token.actions.githubusercontent.com" \
            --arg trivy_result "$TRIVY_RESULT" \
            --arg govulncheck_result "$GOVULNCHECK_RESULT" \
            --arg vex_document ".vex/CVE-2026-56852.openvex.json" \
            --arg vex_vulnerability "CVE-2026-56852" \
            --arg vex_status "not_affected" \
            --argjson asset_names "$asset_names" \
            '{tag:$tag,source_sha:$source_sha,workflow_url:$workflow_url,image:$image,chart:$chart,image_digest:$image_digest,chart_digest:$chart_digest,asset_names:$asset_names,cosign_version:$cosign_version,certificate_identity:$certificate_identity,certificate_oidc_issuer:$certificate_oidc_issuer,trivy_result:$trivy_result,govulncheck_result:$govulncheck_result,vex_document:$vex_document,vex_vulnerability:$vex_vulnerability,vex_status:$vex_status}' \
            > "$audit_file"
          jq -e '.source_sha | test("^[0-9a-f]{40}$")' "$audit_file" >/dev/null
      - name: Upload sanitized release audit input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-audit-input-${{ github.ref_name }}
          path: ${{ runner.temp }}/release-audit-input.json
          if-no-files-found: error
          retention-days: 90
