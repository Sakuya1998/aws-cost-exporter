site_name: AWS Cost Exporter
site_description: Documentation for AWS Cost Exporter v0.3.0
site_url: https://sakuya1998.github.io/aws-cost-exporter/
repo_url: https://github.com/Sakuya1998/aws-cost-exporter
repo_name: Sakuya1998/aws-cost-exporter
docs_dir: .pages-docs
site_dir: site

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - English:
      - Home: index.md
      - Getting started:
          - Getting Started: Getting-Started.md
          - Installation: Installation.md
          - Configuration Reference: Configuration-Reference.md
      - AWS data:
          - Credentials and Targets: Credentials-and-Targets.md
          - Cost Explorer: Cost-Explorer.md
          - CUR and Athena: CUR-and-Athena.md
          - Optional Collectors: Optional-Collectors.md
      - Observability:
          - Metrics Reference: Metrics-Reference.md
          - Dashboards, PromQL and Alerts: Dashboards-PromQL-and-Alerts.md
      - Operations:
          - Operations and Cost Control: Operations-and-Cost-Control.md
          - Troubleshooting and Logging: Troubleshooting-and-Logging.md
          - IAM and Security: IAM-and-Security.md
      - Development:
          - Architecture: Architecture.md
          - Development and Testing: Development-and-Testing.md
          - Releases and Supply Chain: Releases-and-Supply-Chain.md
  - 简体中文:
      - 首页: Home-zh-CN.md
      - 入门:
          - 快速开始: Getting-Started-zh-CN.md
          - 安装: Installation-zh-CN.md
          - 配置参考: Configuration-Reference-zh-CN.md
      - AWS 数据:
          - 凭证与目标: Credentials-and-Targets-zh-CN.md
          - Cost Explorer 成本: Cost-Explorer-zh-CN.md
          - CUR 与 Athena: CUR-and-Athena-zh-CN.md
          - 可选采集器: Optional-Collectors-zh-CN.md
      - 可观测性:
          - 指标参考: Metrics-Reference-zh-CN.md
          - 仪表盘、PromQL 与告警: Dashboards-PromQL-and-Alerts-zh-CN.md
      - 运维:
          - 运行与成本控制: Operations-and-Cost-Control-zh-CN.md
          - 故障排查与日志: Troubleshooting-and-Logging-zh-CN.md
          - IAM 与安全: IAM-and-Security-zh-CN.md
      - 开发:
          - 架构: Architecture-zh-CN.md
          - 开发与测试: Development-and-Testing-zh-CN.md
          - 发布与供应链: Releases-and-Supply-Chain-zh-CN.md
